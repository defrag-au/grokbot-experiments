name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml picks the channel, components and wasm32 target.
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Native libraries for the macroquad clients
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxi-dev libgl1-mesa-dev libasound2-dev
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: clippy (wasm32)
        run: |
          cargo clippy --target wasm32-unknown-unknown -- -D warnings \
            $(cargo metadata --no-deps --format-version 1 \
              | jq -r '.packages[] | select(.manifest_path | contains("/experiments/")) | "-p " + .name')
      - run: cargo test --workspace

  wasm-bindgen:
    name: no wasm-bindgen in macroquad clients
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: ./scripts/check-no-wasm-bindgen.sh

  build:
    name: build workers (${{ matrix.experiment }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        experiment: [hello-arena]
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Build (mq-bundle + worker-build), as wrangler would
        working-directory: experiments/${{ matrix.experiment }}
        run: ../../scripts/build-worker.sh
